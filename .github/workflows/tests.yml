name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Копируем код из репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Укажи версию, которая у тебя локально

    - name: Устанавливаем зависимости
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy python-dotenv pillow flask-socketio flask-wtf flask-limiter pytest pytest-flask

    - name: Запускаем тесты
      run: |
        python -m pytest -v